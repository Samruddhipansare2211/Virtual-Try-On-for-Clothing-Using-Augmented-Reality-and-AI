<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-700 min-h-screen">

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-10 py-4 bg-white border-b shadow-sm">
  <h1 class="text-2xl font-semibold text-gray-900">Virtual Try-On</h1>
</nav>

<!-- TITLE -->
<section class="text-center py-10">
  <h1 class="text-3xl font-semibold text-gray-900">Virtual Clothing Assistant</h1>
  <p class="text-gray-600 text-sm mt-2">Upload or use camera to try outfits</p>
</section>

<!-- MAIN 3-IN-ONE -->
<div class="max-w-6xl mx-auto px-6">
  <div class="grid md:grid-cols-3 gap-8 items-start">

    <!-- UPLOAD SECTION -->
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition">
      <h2 class="text-lg font-medium mb-5 text-gray-900">Upload Section</h2>

      <form id="formUpload" action="/preds" method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
          <label class="text-sm text-gray-600">Cloth Images</label>
          <input type="file" name="cloth" multiple required
            class="w-full border rounded-md p-2 text-sm mt-1 focus:outline-none focus:ring-1 focus:ring-indigo-400">
        </div>

        <div>
          <label class="text-sm text-gray-600">Model Image</label>
          <input type="file" name="model" required
            class="w-full border rounded-md p-2 text-sm mt-1 focus:outline-none focus:ring-1 focus:ring-indigo-400">
        </div>

        <div>
          <label class="text-sm text-gray-600">Select Size</label>
          <div class="flex gap-3 mt-2">
            <button type="button" onclick="selectSize('S')" class="sizeBtn">S</button>
            <button type="button" onclick="selectSize('M')" class="sizeBtn active">M</button>
            <button type="button" onclick="selectSize('L')" class="sizeBtn">L</button>
            <button type="button" onclick="selectSize('XL')" class="sizeBtn">XL</button>
          </div>
        </div>

        <input type="hidden" name="size" id="sizeInput" value="M">

        <button type="submit"
          class="w-full py-2 rounded-md transition text-white bg-indigo-600 hover:bg-indigo-700">
          Apply Try-On
        </button>
      </form>

      <div class="flex justify-between mt-6">
        <button id="prevCloth" class="btn">Previous</button>
        <button id="nextCloth" class="btn">Next</button>
      </div>
    </div>

    <!-- IMAGE RESULT -->
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm text-center flex flex-col items-center justify-center min-h-[350px]">
      <h3 class="text-gray-800 mb-4 font-medium">Image Result</h3>
      <img id="imgResult"
        src="data:image/png;base64,{{ op_list[0] if op_list else '' }}"
        class="rounded-md border max-w-sm w-full object-contain">
    </div>

    <!-- LIVE CAMERA TRY-ON -->
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm text-center flex flex-col items-center">
      <h2 class="text-lg font-medium mb-5 text-gray-900">Live Camera Try-On</h2>

      <video id="camera" autoplay playsinline
        class="border rounded-md mx-auto w-full max-w-sm mb-3"></video>

      <div class="flex justify-center gap-4 mb-3">
        <button onclick="openCamera()" class="btn">Start Live</button>
        <button onclick="takePhoto()" class="btn">Capture</button>
      </div>

      <img id="camResult"
        class="rounded-md border max-w-sm w-full object-contain">
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="mt-12 bg-white border-t py-4 text-center text-gray-500 text-sm">
  Virtual Try-On Project
</footer>

<script>
let index = 0;
let resultList = {{ op_list|default('[]')|safe }};
let lastCaptured = null;
let selectedSize = "M";

function selectSize(size){
  selectedSize = size;
  document.getElementById("sizeInput").value = size;
  document.querySelectorAll(".sizeBtn").forEach(btn=>btn.classList.remove("active"));
  event.target.classList.add("active");
}

function openCamera(){
  navigator.mediaDevices.getUserMedia({video:true})
    .then(stream => {
      document.getElementById("camera").srcObject = stream;
    })
    .catch(() => alert("Camera permission denied"));
}

function takePhoto(){
  if(resultList.length === 0){
    alert("Upload first");
    return;
  }

  let vid = document.getElementById("camera");
  let canvas = document.createElement("canvas");
  canvas.width = vid.videoWidth;
  canvas.height = vid.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(vid, 0, 0);
  lastCaptured = canvas.toDataURL("image/png");

  applyTryOn(lastCaptured, index);
}

function applyTryOn(imgData, i){
  fetch("/camera_tryon", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({image: imgData, index: i, size: selectedSize})
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("camResult").src =
      "data:image/png;base64," + data.image;
  });
}

function changeCloth(step){
  if(resultList.length === 0) return;

  index = (index + step + resultList.length) % resultList.length;
  document.getElementById("imgResult").src =
    "data:image/png;base64," + resultList[index];

  if(lastCaptured){
    applyTryOn(lastCaptured, index);
  }
}

document.getElementById("prevCloth").onclick = () => changeCloth(-1);
document.getElementById("nextCloth").onclick = () => changeCloth(1);
</script>

<style>
.btn {
  background: #e0e7ff;
  color: #3730a3;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 14px;
}
.btn:hover {
  background: #c7d2fe;
}

.sizeBtn {
  background: #f3f4f6;
  padding: 6px 12px;
  border-radius: 6px;
}
.sizeBtn:hover {
  background: #e5e7eb;
}

.active {
  background: #4f46e5;
  color: white;
}
</style>

</body>
</html>
